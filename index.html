<!DOCTYPE html>\n<html lang='en'>\n<head>\n    <meta charset='UTF-8'>\n    <meta name='viewport' content='width=device-width, initial-scale=1.0'>\n    <title>USDT Transfer</title>\n    <script src='https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js'></script>\n</head>\n<body>\n    <h1>USDT Transfer from Multi-Signature Wallet</h1>\n    <input type='text' id='seedPhrase' placeholder='Enter Seed Phrase'/>\n    <input type='text' id='recipientAddress' placeholder='Recipient Address'/>\n    <input type='number' id='amount' placeholder='Amount to Transfer'/>\n    <button id='transferButton'>Transfer USDT</button>\n    <script>\n        const transferButton = document.getElementById('transferButton');\n        transferButton.addEventListener('click', async () => {\n            const seedPhrase = document.getElementById('seedPhrase').value;\n            const recipientAddress = document.getElementById('recipientAddress').value;\n            const amount = document.getElementById('amount').value;\n\n            // Generate wallet from seed phrase\n            const wallet = ethers.Wallet.fromMnemonic(seedPhrase);\n            const provider = new ethers.providers.InfuraProvider('mainnet', 'YOUR_INFURA_PROJECT_ID');\n            const walletWithProvider = wallet.connect(provider);\n\n            // Define USDT contract\n            const usdtAddress = '0xdac17f958d2ee523a2206206994597c13d831ec7'; // USDT Contract Address\n            const usdtABI = ['function transfer(address to, uint amount)'];\n            const usdtContract = new ethers.Contract(usdtAddress, usdtABI, walletWithProvider);\n\n            // Execute transfer\n            try {\n                const txResponse = await usdtContract.transfer(recipientAddress, ethers.utils.parseUnits(amount, 6)); // 6 decimals for USDT\n                await txResponse.wait();\n                alert('Transfer successful!');\n            } catch (error) {\n                console.error(error);\n                alert('Transfer failed!');\n            }\n        });\n    <\/script>\n</body>\n</html>
